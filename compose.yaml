services:
  app:
    build:
      context: .
    image: ai-mechanic-assistant:demo
    platform: linux/arm64
    ports:
      - "127.0.0.1:${APP_PORT:-7860}:7860"
    environment:
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7860
      OPENAI_API_BASE: https://api.openai.com/v1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDINGS_MODEL: ${OPENAI_EMBEDDINGS_MODEL:-text-embedding-3-small}
      REGCHECK_USERNAME: ${REGCHECK_USERNAME:-}
      USE_MS_GRAPHRAG: "false"
      USE_LIGHTRAG: "false"
      USE_NANO_GRAPHRAG: "false"
    volumes:
      - ./data/kotaemon:/app/ktem_app_data
      - ./data/manuals:/app/manuals:ro
      - ./scripts:/app/project-scripts:ro
      - ./data/model-cache/huggingface:/root/.cache/huggingface
      - ./data/model-cache/easyocr:/root/.EasyOCR
      - ./data/model-cache/docling:/app/ktem_app_data/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
